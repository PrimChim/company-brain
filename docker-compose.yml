services:

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile

    container_name: company_brain_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    restart: unless-stopped


  postgres:
    image: postgres:15-alpine

    container_name: company_brain_postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  neo4j:
    image: neo4j:latest

    container_name: company_brain_neo4j

    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    ports:
      - "7474:7474"
      - "7687:7687"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: